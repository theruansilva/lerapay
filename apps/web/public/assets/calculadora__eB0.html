<body>
    <div class="calculadora">
        <div class="container mt-4">
            <div class="text-center mb-4">
                <h1 class="display-4" style="color: #958BC2; font-weight: 800; margin-bottom: 0.5rem;">Simulador de Taxas</h1>
                <h2 class="h3" style="color: #FFFFFF; font-weight: 500;">No Lera Pay você recebe mais</h2>
            </div>
            
            <div class="row">
                <div class="col-md-6 text-center">
                    <form id="simulador-form">
                        <div class="row mb-3">
                            <label class="form-label text-white">Selecione:</label>
                            <div class="btn-group" role="group" aria-label="Plano Ton">
                                <input type="radio" class="btn-check" name="plano" id="com_antecipacao" value="Com Antecipação" checked="checked">
                                <label class="btn btn-outline-success" for="com_antecipacao">Com Antecipação</label>
                                
                                <input type="radio" class="btn-check" name="plano" id="sem_antecipacao" value="Sem Antecipação">
                                <label class="btn btn-outline-secondary" for="sem_antecipacao">Sem Antecipação</label>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="tipo_venda" class="form-label text-white">Tipo da venda</label>
                                <select class="form-select" name="tipo_venda" id="tipo_venda"><option value="1x" selected="selected">À vista</option><option value="2x">Parcelado em 2x</option><option value="3x">Parcelado em 3x</option><option value="4x">Parcelado em 4x</option><option value="5x">Parcelado em 5x</option><option value="6x">Parcelado em 6x</option><option value="7x">Parcelado em 7x</option><option value="8x">Parcelado em 8x</option><option value="9x">Parcelado em 9x</option><option value="10x">Parcelado em 10x</option><option value="11x">Parcelado em 11x</option><option value="12x">Parcelado em 12x</option><option value="13x">Parcelado em 13x</option><option value="14x">Parcelado em 14x</option><option value="15x">Parcelado em 15x</option><option value="16x">Parcelado em 16x</option><option value="17x">Parcelado em 17x</option><option value="18x">Parcelado em 18x</option><option value="19x">Parcelado em 19x</option><option value="20x">Parcelado em 20x</option><option value="21x">Parcelado em 21x</option></select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="valor_venda" class="form-label text-white">Valor da venda</label>
                                <input type="text" class="form-control money" name="valor_venda" id="valor_venda" value="1.000,00" maxlength="22">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label for="quem_paga_taxa" class="form-label text-white">Quem paga a taxa?</label>
                                <select class="form-select" name="quem_paga_taxa" id="quem_paga_taxa">
                                    <option value="eu" selected="selected">Eu</option>
                                    <option value="cliente">Cliente</option>
                                </select>
                            </div>
                        </div>
                        
                        <button type="button" id="simular-btn" class="btn btn-primary text-white">Simular</button>

                    </div>
                </div>

            <div class="row mt-4" style="margin-top: -15px !important;">
                <div class="col-12 text-center">
                    <p class="text-white">Para mais informações sobre taxas e maquininhas, <a href="https://lerapay.com.br/taxas.php" target="_parent" class="text-white"><strong>clique aqui</strong></a>.</p>
                </div>

    <script src="jquery-3.7.1.min__eB0.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="jquery.mask.min__eB0.js"></script> 
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const planoInputs = document.querySelectorAll('input[name="plano"]');
        const tipoVendaSelect = document.getElementById('tipo_venda');
        const simularBtn = document.getElementById('simular-btn');
        const resultadoDiv = document.getElementById('resultado');
        const quemPagaTaxaSelect = document.getElementById('quem_paga_taxa');

        // Função para formatar números em BRL
        function formatBRL(value) {
            return value.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Taxas atualizadas
       const taxasComAntecipacao = {
            '1x': 3.28,
            '2x': 4.03,
            '3x': 4.77,
            '4x': 5.52,
            '5x': 6.26,
            '6x': 7.01,
            '7x': 7.75,
            '8x': 8.50,
            '9x': 9.24,
            '10x': 9.99,
            '11x': 10.73,
            '12x': 11.48,
            '13x': 12.22,
            '14x': 12.97,
            '15x': 13.71,
            '16x': 14.46,
            '17x': 15.20,
            '18x': 15.95,
            '19x': 16.69,
            '20x': 17.44,
            '21x': 18.18
        };


        const taxasSemAntecipacao = {
            '1x': 3.10,
            '2x': 3.80,
            '3x': 3.80,
            '4x': 3.80,
            '5x': 3.80,
            '6x': 3.80,
            '7x': 3.95,
            '8x': 3.95,
            '9x': 3.95,
            '10x': 3.95,
            '11x': 3.95,
            '12x': 3.95
        };

        const opcoesComAntecipacao = Object.keys(taxasComAntecipacao).map(key => ({
            value: key,
            text: key === '1x' ? 'À vista' : `Parcelado em ${key}`
        }));

        const opcoesSemAntecipacao = Object.keys(taxasSemAntecipacao).map(key => ({
            value: key,
            text: key === '1x' ? 'À vista' : `Parcelado em ${key}`
        }));

        function atualizarOpcoesTipoVenda(plano) {
            tipoVendaSelect.innerHTML = '';
            const opcoes = plano === 'Com Antecipação' ? opcoesComAntecipacao : opcoesSemAntecipacao;
            opcoes.forEach(function (opcao) {
                const option = document.createElement('option');
                option.value = opcao.value;
                option.text = opcao.text;
                tipoVendaSelect.appendChild(option);
            });
        }

        planoInputs.forEach(function (input) {
            input.addEventListener('change', function () {
                atualizarOpcoesTipoVenda(this.value);
            });
        });

        // Inicialização das opções de tipo de venda
        atualizarOpcoesTipoVenda('Com Antecipação');

        // Lógica do botão "Simular"
        simularBtn.addEventListener('click', function (e) {
            e.preventDefault();
            const valorVenda = parseFloat(document.getElementById('valor_venda').value.replace(/\./g,"").replace(",","."));
            const plano = document.querySelector('input[name="plano"]:checked').value;
            const tipoVenda = tipoVendaSelect.value;
            const quemPagaTaxa = quemPagaTaxaSelect.value;

            // Obtendo a taxa correta
            const taxa = plano === 'Com Antecipação' ? taxasComAntecipacao[tipoVenda] : taxasSemAntecipacao[tipoVenda];
            // Formatando a taxa com 2 casas decimais
            const taxaFormatada = taxa.toFixed(2);

            let valorRecebido, valorCobrarCliente, valorLiquido;

            if (quemPagaTaxa === 'eu') {
                valorRecebido = valorVenda - (valorVenda * taxa / 100);
                valorCobrarCliente = valorVenda;
                valorLiquido = valorRecebido;
            } else {
                valorCobrarCliente = valorVenda + (valorVenda * taxa / 100);
                valorRecebido = valorVenda;
                valorLiquido = valorVenda;
            }

            const diasReceber = plano === 'Com Antecipação' ? "1 dia útil" : "30 dias";
            
            // Calcular valor da parcela
            const numeroParcelas = parseInt(tipoVenda.replace('x', ''));
            const valorParcela = valorCobrarCliente / numeroParcelas;

            let htmlResultado = `
                <h4>Você recebe: <strong>R$ ${formatBRL(valorRecebido)}</strong></h4>
                <p>Taxa ${plano} ${tipoVenda}: <strong>${taxaFormatada}%</strong></p>
                <p>Valor a cobrar do cliente: <strong>R$ ${formatBRL(valorCobrarCliente)}</strong></p>`;
                
            if (numeroParcelas > 1) {
                htmlResultado += `<p>Valor de cada parcela: <strong>R$ ${formatBRL(valorParcela)}</strong></p><br>`;
            }
            
            htmlResultado += `
                <p>Valor líquido a receber: <strong>R$ ${formatBRL(valorLiquido)}</strong></p>
                <p>Recebimento da venda: <strong>${diasReceber}</strong></p>`;
            
            resultadoDiv.innerHTML = htmlResultado;
        });
    });
</script>
